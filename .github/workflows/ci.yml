name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...
      - name: smoke test on fixtures
        run: |
          go run ./cmd/pgupcheck --from 13 --to 18 --schema testdata/schema.sql --conf testdata/postgresql.conf --format sarif > /dev/null || [ $? -eq 1 ]

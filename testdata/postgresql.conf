# fixture for pgupcheck tests
listen_addresses = '*'          # comment
wal_keep_segments = 64
stats_temp_directory = '/run/postgresql/pg_stat_tmp'   # a '#' inside a 'quoted # value' is fine
vacuum_defer_cleanup_age = 0
old_snapshot_threshold = -1
